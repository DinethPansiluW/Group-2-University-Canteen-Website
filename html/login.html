<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | University of Ruhuna Canteens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700;800&family=Noto+Sans+Sinhala:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../shared/layout.css">
<script>if(/[?&]embed=1/.test(location.search)){document.documentElement.classList.add('embed');var b=document.createElement('base');b.target='_top';document.head.appendChild(b);}</script>
</head>
<body>
   <div data-site-header data-actions></div>

<main>
  <section class="hero register-hero section-wrap" id="login">
    <div class="register-card">
      <h2>Student Login</h2>
      <p class="muted">Enter your registered Student ID or email and password.</p>
      <form id="login-form" novalidate>
        <label class="form-label" for="identifier">Student ID or university email
          <input id="identifier" name="identifier" autocomplete="username" placeholder="e.g. SC/2022/12345 or you@example.com" aria-describedby="err-identifier">
          <small class="field-error" id="err-identifier"></small>
        </label>

        <label class="form-label" for="password">Password
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="err-password">
          <small class="field-error" id="err-password"></small>
        </label>

        <label class="check-filter" for="show-password"><input type="checkbox" id="show-password"> Show password</label>

        <label class="check-filter" for="remember-me"><input type="checkbox" id="remember-me"> Keep me signed in on this browser</label>

        <button class="button button-green full submit-button" type="submit" id="login-submit">Sign in</button>
        <p class="switch-note">New to Ruhuna Eats? <a class="text-link" href="register.html">Create an account</a></p>
      </form>
    </div>
  </section>
</main>

<div data-site-footer></div>

    <script src="../shared/layout.js"></script>

<div class="modal-backdrop" id="success-modal" role="dialog" aria-modal="true" aria-labelledby="success-title">
  <div class="modal success-modal">
    <div class="success-icon" aria-hidden="true">✓</div>
    <h2 id="success-title">Signed in!</h2>
    <p id="success-text"></p>
    <div class="success-details">Student ID <b id="success-id"></b></div>
    <a class="button button-green full" id="success-continue" href="menu.html">Browse menu</a>
    <button class="button button-light full" type="button" id="stay-here">Stay on login page</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="../js/login.js"></script>
</body>
</html>
